services:
  tide-api:
    build: .
    image: tide-navigation-api:latest
    container_name: tide-navigation-api
    ports:
      - "8000:8000"
    environment:
      # SQLite 数据库文件位置 (容器内); 通过命名卷持久化
      DB_PATH: /data/tides.db
      # 是否写入演示港口与预报点: 1=是, 0=否
      SEED_DEMO: "1"
      HOST: 0.0.0.0
      PORT: "8000"
    volumes:
      - tide-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  tide-data:
